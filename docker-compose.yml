# 학교 서버 등 Docker가 있는 서버 1대에 웹 + Redis를 같이 띄운다.
#   cp .env.example .env   (ADMIN_PASSWORD, REDIS_PASSWORD 채우기)
#   docker compose up -d --build
#
# Redis는 서버 안(127.0.0.1)에만 열린다. YOBA 노트북은 SSH 터널로 붙는다 (README "학교 서버 배포").

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?.env에 REDIS_PASSWORD를 넣어 주세요}", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    environment:
      PORT: 8080
      DB_PATH: /app/data/yoba-web.db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      # 이름 있는 볼륨: 이미지의 /app/data 권한(node)을 그대로 이어받아 DB를 쓸 수 있다
      # (./data 같은 폴더 연결은 root 소유로 만들어져 node가 쓰지 못함)
      - yoba-data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  yoba-data:
